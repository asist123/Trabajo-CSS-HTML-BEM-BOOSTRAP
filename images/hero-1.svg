<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d7dae9"/>
      <stop offset="1" stop-color="#b7bbd6"/>
    </linearGradient>
    <linearGradient id="liquid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4cc3f1"/>
      <stop offset="1" stop-color="#1c8fd0"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>

  <rect width="1920" height="1000" fill="url(#bg)"/>

  <!-- Fondo desenfocado: frascos y bandeja -->
  <g filter="url(#blur)" opacity=".85">
    <rect x="1020" y="260" width="200" height="300" rx="30" fill="#8d8fa3"/>
    <rect x="1050" y="200" width="140" height="80" rx="12" fill="#6e7084"/>
    <rect x="1330" y="250" width="150" height="260" rx="24" fill="#a9abbd"/>
    <rect x="1600" y="230" width="190" height="300" rx="30" fill="#9a9cb0"/>
    <rect x="800" y="320" width="120" height="220" rx="20" fill="#a4a6b9"/>
    <rect x="1000" y="700" width="760" height="90" rx="30" fill="#e6e7f0"/>
    <ellipse cx="1360" cy="790" rx="70" ry="34" fill="#4a8fe0"/>
    <ellipse cx="1540" cy="760" rx="70" ry="34" fill="#4a8fe0"/>
    <ellipse cx="1280" cy="920" rx="60" ry="30" fill="#5ba0e8"/>
    <ellipse cx="1700" cy="700" rx="56" ry="28" fill="#c9c6d4"/>
  </g>

  <!-- Bata -->
  <path d="M300 1000 C330 760 470 700 690 660 L830 660 C1030 700 1130 780 1160 1000 Z" fill="#ecebf5"/>
  <path d="M690 660 L760 800 L830 660 Z" fill="#d6d4e6"/>

  <!-- Cuello y cabeza -->
  <rect x="690" y="560" width="130" height="130" rx="40" fill="#e0ab94"/>

  <!-- Cabello (fondo y coleta) -->
  <path d="M590 380 C590 220 760 170 880 250 C980 300 1010 440 960 560 C930 640 880 700 880 700 C960 600 930 400 840 330 C760 270 660 300 640 420 Z" fill="#4b2a24"/>
  <ellipse cx="760" cy="440" rx="150" ry="195" fill="#e8b8a0"/>
  <path d="M610 400 C620 250 780 220 860 290 C800 270 700 300 670 410 Z" fill="#4b2a24"/>

  <!-- Cara -->
  <ellipse cx="715" cy="450" rx="22" ry="12" fill="#fff"/>
  <ellipse cx="830" cy="448" rx="22" ry="12" fill="#fff"/>
  <circle cx="718" cy="450" r="10" fill="#4a2c20"/>
  <circle cx="828" cy="448" r="10" fill="#4a2c20"/>
  <path d="M680 418 Q715 400 745 416" stroke="#4b2a24" stroke-width="7" fill="none" stroke-linecap="round"/>
  <path d="M800 414 Q835 396 865 414" stroke="#4b2a24" stroke-width="7" fill="none" stroke-linecap="round"/>
  <path d="M775 460 Q770 520 790 530" stroke="#c98c76" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M735 585 Q775 598 815 580" stroke="#b86c62" stroke-width="9" fill="none" stroke-linecap="round"/>

  <!-- Tubo de ensayo -->
  <g transform="rotate(-18 520 560)">
    <rect x="500" y="300" width="70" height="520" rx="35" fill="#ffffff" opacity=".35" stroke="#ffffff" stroke-width="5"/>
    <rect x="508" y="560" width="54" height="250" rx="27" fill="url(#liquid)" opacity=".8"/>
  </g>

  <!-- Matraz -->
  <g>
    <circle cx="170" cy="560" r="170" fill="#ffffff" opacity=".3"/>
    <path d="M10 560 A170 170 0 0 0 330 600 L330 520 Q200 470 10 520 Z" fill="url(#liquid)" opacity=".9"/>
    <rect x="240" y="330" width="110" height="140" rx="30" fill="#ffffff" opacity=".35" transform="rotate(25 295 400)"/>
  </g>

  <!-- Guantes azules -->
  <g fill="#2f86d6">
    <ellipse cx="300" cy="500" rx="120" ry="90" transform="rotate(-25 300 500)"/>
    <ellipse cx="610" cy="760" rx="150" ry="100" transform="rotate(-20 610 760)"/>
    <path d="M60 760 C100 640 240 620 330 640 L330 900 L60 900 Z"/>
  </g>
  <g fill="#256fb8">
    <rect x="215" y="330" width="40" height="110" rx="20" transform="rotate(20 235 385)"/>
    <rect x="262" y="320" width="40" height="120" rx="20" transform="rotate(14 282 380)"/>
    <rect x="520" y="650" width="46" height="110" rx="22" transform="rotate(-8 543 705)"/>
    <rect x="575" y="640" width="46" height="120" rx="22" transform="rotate(-8 598 700)"/>
  </g>

  <!-- Manga bata izquierda -->
  <path d="M0 820 C40 760 140 760 240 800 L300 1000 L0 1000 Z" fill="#ecebf5"/>
</svg>
